apiVersion: 1

# Contact points and policies are configured via Grafana UI (Alerting → Contact points).
# Add your webhook URL there after first login.

groups:
  - orgId: 1
    name: GDC Weather
    folder: GDC
    interval: 1m
    rules:

      - uid: gdc-station-offline
        title: WeatherStationOffline
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: "-- Prometheus --"
            model:
              expr: weather_up
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        labels: {severity: critical, station: gdc}
        annotations:
          summary: "GDC weather station is offline"
          description: "No weather data received for >15 minutes."

      - uid: gdc-high-wind
        title: HighWindSpeed
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: "-- Prometheus --"
            model:
              expr: weather_wind_speed_hi_10min_mph
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: {params: [60], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels: {severity: warning, station: gdc}
        annotations:
          summary: "High wind at GDC station"
          description: "10-min high wind {{ $values.A.Value | printf \"%.1f\" }} mph (threshold 60 mph)"

      - uid: gdc-extreme-temp
        title: ExtremeTemperature
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: "-- Prometheus --"
            model:
              expr: weather_temperature_f
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: "__expr__"
            model:
              type: math
              refId: C
              expression: "$A < -10 || $A > 130"
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels: {severity: warning, station: gdc}
        annotations:
          summary: "Extreme temperature reading at GDC"
          description: "Temperature {{ $values.A.Value | printf \"%.1f\" }} °F — may indicate sensor fault"

      - uid: gdc-heavy-rain
        title: HeavyRainRate
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: "-- Prometheus --"
            model:
              expr: weather_rain_rate_in_hr
              instant: true
              refId: A
          - refId: C
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: {params: [2.0], type: gt}
                  operator: {type: and}
                  query: {params: [A]}
                  reducer: {params: [], type: last}
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels: {severity: warning, station: gdc}
        annotations:
          summary: "Heavy rain at GDC"
          description: "Rain rate {{ $values.A.Value | printf \"%.2f\" }} in/hr (threshold 2.0 in/hr)"
