apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: GDC
      defaultBucket: weather
    secureJsonData:
      # Read-only token scoped to the weather bucket; injected from .env.
      token: $INFLUXDB_GRAFANA_TOKEN
    isDefault: true
    editable: false

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: "60s"
    editable: false
