<title>GDC Weather · Muscat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --bg:#040d1a;--s1:#071626;--s2:#0a1d2f;--bd:#0d2237;
  --fg:#c3d7ee;--fg2:#7a9ab8;--fg3:#3e5668;
  --ac:#00c4f4;
  --c-temp:#ff6730;--c-hum:#22d3ee;--c-wind:#34d399;
  --c-rain:#60a5fa;--c-bar:#a78bfa;--c-hi:#fb923c;
  color-scheme:dark;
}
@media(prefers-color-scheme:light){
  :root:not([data-theme=dark]){
    --bg:#f0f5fc;--s1:#fff;--s2:#f4f8ff;--bd:#d8e8f8;
    --fg:#182838;--fg2:#507898;--fg3:#90aac8;--ac:#0088c0;
    color-scheme:light;
  }
}
:root[data-theme=light]{
  --bg:#f0f5fc;--s1:#fff;--s2:#f4f8ff;--bd:#d8e8f8;
  --fg:#182838;--fg2:#507898;--fg3:#90aac8;--ac:#0088c0;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px}
/* Header */
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.hdr-logo{width:42px;height:42px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,#0060a0,var(--ac));
  display:flex;align-items:center;justify-content:center}
.hdr-name{font-size:17px;font-weight:700;letter-spacing:-.4px}
.hdr-loc{font-size:9px;color:var(--fg3);letter-spacing:.5px;margin-top:2px;font-family:'Space Mono',monospace}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip{font-size:9px;padding:3px 9px;border-radius:20px;border:1px solid var(--bd);
  color:var(--fg3);font-family:'Space Mono',monospace;white-space:nowrap;background:var(--s1)}
.chip.live{border-color:var(--ac);color:var(--ac);background:rgba(0,196,244,.06);
  display:inline-flex;align-items:center;gap:5px}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--ac);animation:pulse 1.8s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--bd);
  background:var(--s1);color:var(--fg3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:13px}
.icon-btn:hover{color:var(--ac);border-color:var(--ac)}
/* Live panel */
.live{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.live-top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:10px}
.live-temp{font-size:52px;font-weight:700;letter-spacing:-3px;font-family:'Space Mono',monospace;
  font-variant-numeric:tabular-nums;line-height:1}
.live-temp sup{font-size:21px;letter-spacing:0;vertical-align:super}
.live-lbl{font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:var(--fg3);
  font-family:'Space Mono',monospace;margin-top:4px}
.live-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:7px;flex:1;min-width:220px}
.live-stat{background:var(--s2);border-radius:9px;padding:8px 11px}
.ls-lbl{font-size:8px;letter-spacing:.7px;text-transform:uppercase;color:var(--fg3);font-family:'Space Mono',monospace}
.ls-val{font-size:16px;font-weight:700;font-family:'Space Mono',monospace;
  margin-top:3px;font-variant-numeric:tabular-nums}
.live-ts{font-size:9px;color:var(--fg3);font-family:'Space Mono',monospace;
  border-top:1px solid var(--bd);padding-top:9px;margin-top:4px}
/* Controls */
.ctrls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.sep{width:1px;height:16px;background:var(--bd);flex-shrink:0}
.btn{font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  padding:5px 12px;border-radius:20px;border:1px solid var(--bd);
  background:transparent;color:var(--fg3);cursor:pointer;transition:all .15s;
  font-family:'Space Grotesk',sans-serif;white-space:nowrap}
.btn:hover{color:var(--fg);border-color:var(--fg3)}
.btn.active{background:rgba(0,196,244,.1);border-color:var(--ac);color:var(--ac)}
.btn[data-metric=temp].active{background:rgba(255,103,48,.08);border-color:var(--c-temp);color:var(--c-temp)}
.btn[data-metric=hum].active{background:rgba(34,211,238,.08);border-color:var(--c-hum);color:var(--c-hum)}
.btn[data-metric=wind].active{background:rgba(52,211,153,.08);border-color:var(--c-wind);color:var(--c-wind)}
.btn[data-metric=rain].active{background:rgba(96,165,250,.08);border-color:var(--c-rain);color:var(--c-rain)}
.btn[data-metric=bar].active{background:rgba(167,139,250,.08);border-color:var(--c-bar);color:var(--c-bar)}
.btn[data-metric=hi].active{background:rgba(251,146,60,.08);border-color:var(--c-hi);color:var(--c-hi)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:13px 15px;
  overflow:hidden;position:relative}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--kc);border-radius:12px 12px 0 0}
.kpi-lbl{font-size:8px;letter-spacing:.8px;text-transform:uppercase;color:var(--fg3);font-family:'Space Mono',monospace}
.kpi-val{font-size:22px;font-weight:700;color:var(--kc);font-family:'Space Mono',monospace;
  letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1;margin:5px 0 2px}
.kpi-unit{font-size:10px;font-weight:400;opacity:.7}
.kpi-meta{font-size:9px;color:var(--fg3)}
.kpi-spark{margin-top:7px;height:26px;overflow:hidden}
/* Chart cards */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:17px 18px;margin-bottom:12px}
.card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-title{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--fg3);font-family:'Space Mono',monospace}
.lgnd{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--fg3)}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cwrap{position:relative;height:250px}
/* Bento */
.bento{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px;align-items:start}
.bento>.card{margin-bottom:0}
@media(max-width:680px){.bento{grid-template-columns:1fr}}
/* Calendar */
.cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cal-inner{display:inline-flex;gap:8px;align-items:flex-start;padding:2px}
.cal-mo{flex-shrink:0}
.cal-mo-lbl{font-size:8px;color:var(--fg3);letter-spacing:.5px;text-transform:uppercase;
  font-family:'Space Mono',monospace;margin-bottom:4px}
.cal-cols{display:flex;gap:2px}
.cal-col{display:flex;flex-direction:column;gap:2px}
.cal-cell{width:10px;height:10px;border-radius:2px;cursor:default}
.cal-cell[data-v]:hover{outline:1px solid rgba(200,200,255,.5);outline-offset:0;z-index:1;position:relative}
/* Extremes */
.ext-list{display:flex;flex-direction:column;gap:7px}
.ext-item{background:var(--s2);border-left:3px solid var(--ec);border-radius:0 8px 8px 0;padding:9px 11px}
.ext-lbl{font-size:8px;letter-spacing:.7px;text-transform:uppercase;color:var(--fg3);font-family:'Space Mono',monospace}
.ext-val{font-size:19px;font-weight:700;color:var(--ec);font-family:'Space Mono',monospace;
  letter-spacing:-.5px;line-height:1.2}
.ext-date{font-size:9px;color:var(--fg3);margin-top:1px}
/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:480px}
th{font-size:8px;letter-spacing:.6px;text-transform:uppercase;color:var(--fg3);
  font-family:'Space Mono',monospace;padding:6px 9px;text-align:right;
  border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child{text-align:left}
td{padding:7px 9px;color:var(--fg);text-align:right;font-variant-numeric:tabular-nums;
  border-bottom:1px solid rgba(13,34,55,.5)}
td:first-child{text-align:left;font-weight:600}
tr:hover td{background:var(--s2)}
.mbar{display:inline-block;height:3px;border-radius:2px;vertical-align:middle;margin-left:3px;opacity:.7}
/* Export */
.exp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--bd)}
.exp-lbl{font-size:9px;letter-spacing:.7px;text-transform:uppercase;color:var(--fg3);font-family:'Space Mono',monospace}
.exp-btn{font-size:10px;font-weight:600;padding:6px 14px;border-radius:8px;
  border:1px solid var(--bd);background:var(--s1);color:var(--fg2);cursor:pointer;
  transition:all .15s;font-family:'Space Grotesk',sans-serif}
.exp-btn:hover{border-color:var(--ac);color:var(--ac);background:rgba(0,196,244,.06)}
#exp-status{font-size:10px;color:var(--fg3);font-family:'Space Mono',monospace}
</style>

/* ── Thermal color ─────────────────── */
function tc(c) {
  if (c == null) return '#3e5668';
  const s = [[15,[59,130,246]],[22,[6,182,212]],[27,[16,185,129]],[32,[132,204,22]],[37,[245,158,11]],[42,[249,115,22]],[47,[239,68,68]]];
  if (c <= s[0][0]) return `rgb(${s[0][1]})`;
  for (let i = 0; i < s.length-1; i++) {
    const [t0,c0] = s[i], [t1,c1] = s[i+1];
    if (c <= t1) {
      const f = (c-t0)/(t1-t0);
      return `rgb(${[0,1,2].map(j=>Math.round(c0[j]+(c1[j]-c0[j])*f)).join(',')})`;
    }
  }
  return `rgb(${s[s.length-1][1]})`;
}

/* ── Helpers ───────────────────────── */
const fmtD = d => d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'2-digit',timeZone:'UTC'});
const fmtM = d => d.toLocaleDateString('en-GB',{month:'short',year:'numeric',timeZone:'UTC'});
function getFiltered() {
  if (!curRange) return DATA;
  const cut = new Date(); cut.setDate(cut.getDate()-curRange);
  return DATA.filter(d => d.date >= cut);
}

/* ── Sparkline SVG ─────────────────── */
function spark(vals, color) {
  const vs = vals.filter(v => v != null && v !== undefined);
  if (vs.length < 2) return '';
  const W=100, H=26, mn=Math.min(...vs), mx=Math.max(...vs), rng=mx-mn||1;
  const pts = vs.map((v,i)=>`${(i/(vs.length-1)*W).toFixed(1)},${(H-(v-mn)/rng*(H-6)-3).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none"><polygon points="0,${H} ${pts} ${W},${H}" fill="${color}" opacity=".15"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* ── Live panel ────────────────────── */
function renderLive() {
  const {temp:t, hum:h, wind:w, heat_index:hi, dew_point:dp, ts} = LIVE;
  const col = tc(t);
  const tsStr = new Date(ts).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'}) + ' UTC+4';
  const stats = [
    {lbl:'Humidity',    val: h  != null ? h.toFixed(0)+'%'    : '--', col:'#22d3ee'},
    {lbl:'Wind',        val: w  != null ? w.toFixed(1)+' km/h': '--', col:'#34d399'},
    {lbl:'Heat Index',  val: hi != null ? hi.toFixed(1)+'°C'  : '--', col:'#fb923c'},
    {lbl:'Dew Point',   val: dp != null ? dp.toFixed(1)+'°C'  : '--', col:'#2dd4bf'},
  ];
  document.getElementById('live-panel').innerHTML = `
    <div class="live-top">
      <div>
        <div class="live-temp" style="color:${col}">${t!=null?t.toFixed(1):'--'}<sup>°C</sup></div>
        <div class="live-lbl">Current Temperature</div>
      </div>
      <div class="live-stats">${stats.map(s=>`<div class="live-stat"><div class="ls-lbl">${s.lbl}</div><div class="ls-val" style="color:${s.col}">${s.val}</div></div>`).join('')}</div>
    </div>
    <div class="live-ts">Last reading: ${tsStr}</div>`;
}

/* ── KPIs ──────────────────────────── */
function renderKPIs(f) {
  if (!f.length) return;
  const maxT  = f.reduce((m,d)=>d.t_max>(m?.t_max??-Infinity)?d:m,null);
  const maxHI = f.reduce((m,d)=>d.hi_max>(m?.hi_max??-Infinity)?d:m,null);
  const maxW  = f.reduce((m,d)=>d.wind_max>(m?.wind_max??-Infinity)?d:m,null);
  const rain  = f.reduce((s,d)=>s+(d.rain_mm||0),0);
  const avgH  = f.reduce((s,d)=>s+(d.hum_avg||0),0)/f.length;
  const kpis = [
    {lbl:'Max Temp',       val:maxT?.t_max?.toFixed(1)??'--',   unit:'°C',   meta:maxT?fmtD(maxT.date):'',   kc:tc(maxT?.t_max),  spk:f.map(d=>d.t_max),  sc:'#ff6730'},
    {lbl:'Max Heat Index', val:maxHI?.hi_max?.toFixed(1)??'--', unit:'°C',   meta:maxHI?fmtD(maxHI.date):'', kc:tc(maxHI?.hi_max),spk:f.map(d=>d.hi_max), sc:'#fb923c'},
    {lbl:'Avg Humidity',   val:avgH.toFixed(0),                 unit:'%',    meta:f.length+' days',           kc:'#22d3ee',         spk:f.map(d=>d.hum_avg),sc:'#22d3ee'},
    {lbl:'Max Wind',       val:maxW?.wind_max?.toFixed(1)??'--',unit:' km/h',meta:maxW?fmtD(maxW.date):'',   kc:'#34d399',         spk:f.map(d=>d.wind_max),sc:'#34d399'},
    {lbl:'Total Rain',     val:rain.toFixed(1),                 unit:' mm',  meta:f.filter(d=>d.rain_mm>0.1).length+' rainy days', kc:'#60a5fa', spk:f.map(d=>d.rain_mm),sc:'#60a5fa'},
  ];
  document.getElementById('kpi-row').innerHTML = kpis.map(k=>`
    <div class="kpi" style="--kc:${k.kc}">
      <div class="kpi-lbl">${k.lbl}</div>
      <div class="kpi-val">${k.val}<span class="kpi-unit">${k.unit}</span></div>
      <div class="kpi-meta">${k.meta}</div>
      <div class="kpi-spark">${spark(k.spk,k.sc)}</div>
    </div>`).join('');
}

/* ── Chart.js heat-zone plugin ─────── */
const heatZones = {
  id:'heatZones',
  beforeDraw(ch) {
    if (curMetric !== 'temp' || !ch.scales?.y) return;
    const {ctx, chartArea:ca, scales:{y}} = ch;
    if (!ca) return;
    [[40,55,'rgba(159,18,57,.07)'],[35,40,'rgba(239,68,68,.07)'],[30,35,'rgba(249,115,22,.06)'],[25,30,'rgba(245,158,11,.05)']].forEach(([mn,mx,col])=>{
      const yT=y.getPixelForValue(mx), yB=y.getPixelForValue(mn);
      ctx.fillStyle=col;
      ctx.fillRect(ca.left, Math.max(yT,ca.top), ca.width, Math.min(yB,ca.bottom)-Math.max(yT,ca.top));
    });
  }
};

/* ── Main chart ────────────────────── */
function isDark() {
  const t = document.documentElement.dataset.theme;
  return t==='dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches);
}
function renderChart(f) {
  if (chart) { chart.destroy(); chart=null; }
  const dark = isDark();
  const gc = dark ? 'rgba(13,34,55,.9)' : 'rgba(0,0,0,.06)';
  const tc2 = dark ? '#3e5668' : '#90aac8';
  const cfg = {
    temp:  {label:'Temperature', unit:'°C', type:'line',
      ds:[
        {label:'Max °C', data:f.map(d=>d.t_max), borderColor:'rgba(239,68,68,.5)', borderWidth:1.5, fill:'+1', backgroundColor:'rgba(255,100,50,.1)', pointRadius:0, tension:.4},
        {label:'Min °C', data:f.map(d=>d.t_min), borderColor:'rgba(59,130,246,.5)', borderWidth:1.5, fill:false, pointRadius:0, tension:.4},
        {label:'Avg °C', data:f.map(d=>d.t_avg), borderColor:'#ff6730', borderWidth:2.5, fill:false, pointRadius:0, tension:.4},
      ]},
    hum:   {label:'Humidity', unit:'%', type:'line',
      ds:[{label:'Avg %', data:f.map(d=>d.hum_avg), borderColor:'#22d3ee', borderWidth:2, fill:'origin', backgroundColor:'rgba(34,211,238,.1)', pointRadius:0, tension:.4}]},
    wind:  {label:'Wind Speed', unit:'km/h', type:'line',
      ds:[
        {label:'Max km/h', data:f.map(d=>d.wind_max), borderColor:'rgba(52,211,153,.5)', borderWidth:1.5, fill:'+1', backgroundColor:'rgba(52,211,153,.08)', pointRadius:0, tension:.4},
        {label:'Avg km/h', data:f.map(d=>d.wind_avg), borderColor:'#34d399', borderWidth:2.5, fill:false, pointRadius:0, tension:.4},
      ]},
    rain:  {label:'Precipitation', unit:'mm', type:'bar',
      ds:[{label:'Rain mm', data:f.map(d=>d.rain_mm), backgroundColor:'rgba(96,165,250,.5)', borderColor:'#60a5fa', borderWidth:1, borderRadius:2}]},
    bar:   {label:'Pressure', unit:'hPa', type:'line',
      ds:[{label:'hPa', data:f.map(d=>d.bar_avg), borderColor:'#a78bfa', borderWidth:2, fill:'origin', backgroundColor:'rgba(167,139,250,.1)', pointRadius:0, tension:.4}]},
    hi:    {label:'Heat Index', unit:'°C', type:'line',
      ds:[{label:'HI Max °C', data:f.map(d=>d.hi_max), borderColor:'#fb923c', borderWidth:2, fill:'origin', backgroundColor:'rgba(251,146,60,.1)', pointRadius:0, tension:.4}]},
  };
  const c = cfg[curMetric];
  document.getElementById('chart-title').textContent = c.label;
  document.getElementById('chart-lgnd').innerHTML = c.ds.map(d=>`<div class="leg"><div class="leg-dot" style="background:${d.borderColor}"></div>${d.label}</div>`).join('');
  chart = new Chart(document.getElementById('main-chart'), {
    type: c.type,
    data: { labels: f.map(d=>d.day), datasets: c.ds },
    plugins: [heatZones],
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      animation:{duration:300},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor: dark ? '#071626' : '#fff',
          borderColor: dark ? '#0d2237' : '#d8e8f8',
          borderWidth:1,
          titleColor: dark ? '#3e5668' : '#90aac8',
          bodyColor: dark ? '#c3d7ee' : '#182838',
          titleFont:{family:'Space Mono',size:9},
          bodyFont:{family:'Space Grotesk',size:11},
          padding:10,
          callbacks:{
            title: items => {
              const d = f[items[0].dataIndex];
              return new Date(d.day+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
            }
          }
        }
      },
      scales:{
        x:{
          grid:{color:gc,drawTicks:false},border:{display:false},
          ticks:{color:tc2,font:{family:'Space Mono',size:9},maxTicksLimit:8,maxRotation:0,
            callback:(v,i)=>{const d=new Date(f[i]?.day+'T12:00:00Z');return isNaN(d)?'':d.toLocaleDateString('en-GB',{month:'short',day:'numeric',timeZone:'UTC'});}
          }
        },
        y:{
          grid:{color:gc,drawTicks:false},border:{display:false},
          beginAtZero: curMetric==='rain',
          ticks:{color:tc2,font:{family:'Space Mono',size:9},
            callback:v=>v+(curMetric==='hum'?'%':curMetric==='bar'?'':'')}
        }
      }
    }
  });
}

/* ── Calendar ──────────────────────── */
function renderCalendar() {
  if (!DATA.length) return;
  const lk = {};
  DATA.forEach(d => { lk[d.day] = d.t_max; });
  const cal = document.getElementById('calendar');
  // months from first to last
  const s = new Date(Date.UTC(DATA[0].date.getUTCFullYear(), DATA[0].date.getUTCMonth(), 1));
  const e = DATA[DATA.length-1].date;
  const months = [];
  let cur = new Date(s);
  while (cur <= e) { months.push(new Date(cur)); cur.setUTCMonth(cur.getUTCMonth()+1); }

  cal.innerHTML = months.map(m => {
    const yr=m.getUTCFullYear(), mo=m.getUTCMonth();
    const dim = new Date(Date.UTC(yr,mo+1,0)).getUTCDate();
    const off = (m.getUTCDay()+6)%7; // Mon=0
    const cols=[]; let col=new Array(off).fill(null);
    for(let d=1;d<=dim;d++){col.push(d);if(col.length===7){cols.push(col);col=[];}}
    if(col.length){while(col.length<7)col.push(null);cols.push(col);}
    const lbl = m.toLocaleDateString('en-GB',{month:'short',year:'2-digit',timeZone:'UTC'});
    return `<div class="cal-mo"><div class="cal-mo-lbl">${lbl}</div><div class="cal-cols">${
      cols.map(col=>`<div class="cal-col">${col.map(day=>{
        if(!day) return '<div class="cal-cell" style="background:transparent"></div>';
        const ds=`${yr}-${String(mo+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const v=lk[ds];
        const bg = v!=null ? tc(v) : 'var(--bd)';
        const op = v!=null ? Math.max(.3,Math.min(1,(v-15)/28)) : .25;
        return `<div class="cal-cell" style="background:${bg};opacity:${op.toFixed(2)}" data-v="${v!=null?v.toFixed(1):''}" title="${ds}${v!=null?': '+v.toFixed(1)+'°C':''}"></div>`;
      }).join('')}</div>`).join('')
    }</div></div>`;
  }).join('');
}

/* ── Extremes ──────────────────────── */
function renderExtremes(f) {
  if (!f.length) return;
  const hotT  = [...f].sort((a,b)=>b.t_max-a.t_max)[0];
  const coolT = [...f].filter(d=>d.t_min!=null).sort((a,b)=>a.t_min-b.t_min)[0];
  const windD = [...f].sort((a,b)=>b.wind_max-a.wind_max)[0];
  const rainD = [...f].sort((a,b)=>b.rain_mm-a.rain_mm)[0];
  const hiD   = [...f].sort((a,b)=>b.hi_max-a.hi_max)[0];
  const items = [
    {lbl:'Hottest Day',       val:hotT?.t_max?.toFixed(1)+'°C',   date:fmtD(hotT.date),   ec:tc(hotT?.t_max)},
    {lbl:'Highest Heat Index',val:hiD?.hi_max?.toFixed(1)+'°C',   date:fmtD(hiD.date),    ec:'#fb923c'},
    {lbl:'Coolest Day',       val:coolT?.t_min?.toFixed(1)+'°C',  date:fmtD(coolT.date),  ec:'#3b82f6'},
    {lbl:'Strongest Wind',    val:windD?.wind_max?.toFixed(1)+' km/h', date:fmtD(windD.date), ec:'#34d399'},
    {lbl:'Most Rain',         val:rainD?.rain_mm?.toFixed(1)+' mm',   date:fmtD(rainD.date), ec:'#60a5fa'},
  ];
  document.getElementById('extremes').innerHTML = items.map(it=>`
    <div class="ext-item" style="--ec:${it.ec}">
      <div class="ext-lbl">${it.lbl}</div>
      <div class="ext-val">${it.val}</div>
      <div class="ext-date">${it.date}</div>
    </div>`).join('');
}

/* ── Monthly table ─────────────────── */
function renderTable() {
  const mos = {};
  DATA.forEach(d => {
    const k = d.day.slice(0,7);
    if (!mos[k]) mos[k]={days:[],date:d.date};
    mos[k].days.push(d);
  });
  const rows = Object.entries(mos).sort(([a],[b])=>b.localeCompare(a)).slice(0,14);
  const maxRain = Math.max(...rows.map(([,m])=>m.days.reduce((s,d)=>s+(d.rain_mm||0),0)),0.1);
  document.getElementById('tbl-body').innerHTML = rows.map(([k,m])=>{
    const d=m.days;
    const at=d.reduce((s,r)=>s+(r.t_avg||0),0)/d.length;
    const xt=Math.max(...d.map(r=>r.t_max||0));
    const nt=Math.min(...d.filter(r=>r.t_min!=null).map(r=>r.t_min));
    const ah=d.reduce((s,r)=>s+(r.hum_avg||0),0)/d.length;
    const xw=Math.max(...d.map(r=>r.wind_max||0));
    const rain=d.reduce((s,r)=>s+(r.rain_mm||0),0);
    const xh=Math.max(...d.map(r=>r.hi_max||0));
    const bw=Math.round(rain/maxRain*50);
    const mn=m.date.toLocaleDateString('en-GB',{month:'short',year:'numeric',timeZone:'UTC'});
    return `<tr>
      <td>${mn}</td>
      <td style="color:${tc(at)}">${at.toFixed(1)}</td>
      <td style="color:${tc(xt)}">${xt.toFixed(1)}</td>
      <td style="color:#3b82f6">${isFinite(nt)?nt.toFixed(1):'--'}</td>
      <td>${ah.toFixed(0)}</td>
      <td>${xw.toFixed(1)}</td>
      <td>${rain.toFixed(1)}<span class="mbar" style="width:${bw}px;background:#60a5fa"></span></td>
      <td style="color:#fb923c">${xh>0?xh.toFixed(1):'--'}</td>
    </tr>`;
  }).join('');
}

/* ── Range chip ────────────────────── */
function updateChip(f) {
  const chip = document.getElementById('range-chip');
  if (!f.length) { chip.textContent='No data'; return; }
  const s=f[0].date.toLocaleDateString('en-GB',{month:'short',year:'2-digit',timeZone:'UTC'});
  const e=f[f.length-1].date.toLocaleDateString('en-GB',{month:'short',year:'2-digit',timeZone:'UTC'});
  chip.textContent = s===e ? s : `${s} – ${e}`;
}

/* ── Main render ───────────────────── */
function render() {
  const f = getFiltered();
  updateChip(f);
  renderKPIs(f);
  renderChart(f);
  renderExtremes(f);
}

/* ── Controls ──────────────────────── */
function setRange(r) {
  curRange=r;
  document.querySelectorAll('[data-range]').forEach(b=>b.classList.toggle('active',+b.dataset.range===r));
  render();
}
function setMetric(m) {
  curMetric=m;
  document.querySelectorAll('[data-metric]').forEach(b=>b.classList.toggle('active',b.dataset.metric===m));
  render();
}
function toggleTheme() {
  const root=document.documentElement;
  const dark=root.dataset.theme==='dark'||(!root.dataset.theme&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  root.dataset.theme=dark?'light':'dark';
  render();
}

/* ── Export ────────────────────────── */
async function exportCSV() {
  const cols=['day','t_min','t_max','t_avg','hum_avg','wind_max','wind_avg','bar_avg','dp_avg','hi_max','rain_mm','uv_max','solar_max'];
  const hdr=['Date','Min°C','Max°C','Avg°C','Hum%','WindMax km/h','WindAvg km/h','Pressure hPa','DewPoint°C','HeatIndex°C','Rain mm','UV Max','Solar W/m²'];
  const csv=hdr.join(',')+'\n'+_D.daily.map(d=>cols.map(c=>d[c]??'').join(',')).join('\n');
  const el=document.getElementById('exp-status');
  if(_dl){try{await _dl.save({filename:'GDC_Weather.csv',data:csv});el.textContent='✓ Saved';}catch(e){el.textContent=e.code==='declined'?'Declined':'Error';}}
  else{const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='GDC_Weather.csv';a.click();el.textContent='✓ '+_D.daily.length+' days';}
  setTimeout(()=>el.textContent='',3000);
}
async function exportJSON() {
  const json=JSON.stringify(_D.daily,null,2);
  const el=document.getElementById('exp-status');
  if(_dl){try{await _dl.save({filename:'GDC_Weather.json',data:json});el.textContent='✓ Saved';}catch(e){el.textContent=e.code==='declined'?'Declined':'Error';}}
  else{const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(json);a.download='GDC_Weather.json';a.click();el.textContent='✓ JSON';}
  setTimeout(()=>el.textContent='',3000);
}

/* ── Init ──────────────────────────── */
renderLive();
renderCalendar();
renderTable();
render();
</script>
